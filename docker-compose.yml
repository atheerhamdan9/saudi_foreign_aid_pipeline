services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: saudi-foreign-aid-pipeline:local
    volumes:
      - ./data:/app/data
    command: ["run", "--date", "${RUN_DATE:-2026-10-11}"]

  dbt:
    image: saudi-foreign-aid-pipeline:local
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    entrypoint: ["dbt"]
    command: ["build", "--project-dir", "dbt", "--profiles-dir", "dbt"]

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: saudi-aid-airflow:local
    container_name: saudi-aid-airflow
    command: ["standalone"]

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/project/src

      DEFAULT_RUN_DATE: ${RUN_DATE:-2026-10-11}
      PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-@daily}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/project/data
      - ./dbt:/opt/project/dbt
      - ./src:/opt/project/src
      - ./contracts:/opt/project/contracts
      - ./tests:/opt/project/tests