
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-foreign-aid-pipeline"
version = "0.1.0"
description = "An end-to-end data engineering pipeline for Saudi foreign aid data"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "PyYAML>=6.0",
    "google-cloud-storage>=2.18,<4.0",
    "google-cloud-bigquery>=3.25,<4.0",
    "streamlit (>=1.65.0,<2.0.0)",
    "pycountry (>=26.2.16,<27.0.0)",
    "babel (>=2.18.0,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

dbt = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "dbt-bigquery>=1.12,<1.13",
]

[project.scripts]
aid-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
